name: osc-validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Run osc-validation suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out osc-simulator
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Hatch
        run: pipx install hatch

      - name: Run osc-validation suite
        id: run_validation
        run: |
          set +e
          hatch env run -e validation validate -- \
            --html=validation-report.html \
            --junitxml=validation-results.xml
          pytest_exit_code=$?
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          total_tests = 0
          failures = 0
          errors = 0
          skipped = 0

          try:
            root = ET.parse("validation-results.xml").getroot()
            suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
            for suite in suites:
              total_tests += int(suite.attrib.get("tests", 0))
              failures += int(suite.attrib.get("failures", 0))
              errors += int(suite.attrib.get("errors", 0))
              skipped += int(suite.attrib.get("skipped", 0))
          except Exception:
            pass

          passed_tests = max(total_tests - failures - errors - skipped, 0)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as github_output:
            github_output.write(f"total_tests={total_tests}\n")
            github_output.write(f"passed_tests={passed_tests}\n")
          PY
          exit "$pytest_exit_code"

      - name: Build validation ratio badge
        if: always()
        uses: peterrhodesdev/build-a-badge@v1.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: validation-suite-tests
          label: validation
          message: ${{ steps.run_validation.outputs.passed_tests }}/${{ steps.run_validation.outputs.total_tests }}

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: validation-report.html
          archive: false
          if-no-files-found: warn

      - name: Upload validation logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: osc-validation-logs
          path: /tmp/pytest-of-runner/
          if-no-files-found: warn
          retention-days: 2
