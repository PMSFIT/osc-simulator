[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osc-simulator"
version = "0.1.0"
description = "ASAM OpenSCENARIO simulator producing ASAM OSI SensorView trace files"
license = "MPL-2.0"
keywords = [ "openscenario", "osi" ]
authors = [
  {email = "osi@pmsf.de"},
  {name = "PMSF"}
]
requires-python = ">=3.10"
dependencies = [
    "osi-python @ git+https://github.com/OpenSimulationInterface/osi-python.git",
    "asam-osi-utilities @ git+https://github.com/lichtblick-suite/asam-osi-utilities.git#subdirectory=python",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "types-lxml>=2024.0",
]

[project.scripts]
osc-simulator = "osc_simulator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/osc_simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=osc_simulator --cov-report=term-missing"

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
