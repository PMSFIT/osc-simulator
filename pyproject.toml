[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osc-simulator"
version = "0.1.0"
description = "ASAM OpenSCENARIO simulator producing ASAM OSI SensorView trace files"
license = "MPL-2.0"
keywords = [ "openscenario", "osi" ]
authors = [
  {email = "osi@pmsf.de"},
  {name = "PMSF"}
]
requires-python = ">=3.10"
dependencies = [
    "osi-python @ git+https://github.com/OpenSimulationInterface/osi-python.git",
    "asam-osi-utilities>=0.4.0,<0.5.0",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "types-lxml>=2024.0",
]
validation = [
    "osc-validation @ git+https://github.com/PMSFIT/osc-validation.git",
    "pytest-html>=4.2",
]

[project.scripts]
osc-simulator = "osc_simulator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/osc_simulator"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.envs.default]
features = [
  "dev",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
test-cov = "pytest --cov=osc_simulator --cov-report=term-missing --cov-report=xml {args}"
lint = "ruff check {args:src tests}"
format = "ruff format {args:src tests}"
type = "mypy {args:src tests}"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=osc_simulator --cov-report=term-missing"

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.hatch.envs.validation]
features = [
  "validation",
]

[tool.hatch.envs.validation.scripts]
validate = "osc-validate --tool OscSimulator --test-profile val-profile.toml {args}"
validate-all = "osc-validate --tool OscSimulator {args}"
