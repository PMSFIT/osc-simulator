[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osc-simulator"
version = "0.1.0"
description = "ASAM OpenSCENARIO simulator producing ASAM OSI SensorView trace files"
requires-python = ">=3.10"
dependencies = [
    # OSI is not on PyPI; install from GitHub before this package:
    #   pip install "git+https://github.com/OpenSimulationInterface/open-simulation-interface.git@v3.7.0"
    "open-simulation-interface>=3.7.0",
    "protobuf>=4.21",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "types-lxml>=2024.0",
]

[project.scripts]
osc-simulator = "osc_simulator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/osc_simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=osc_simulator --cov-report=term-missing"

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
